      responses:
        "201":
          description: Product created (single object, or batch when product is an array)
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: Single product
                    properties:
                      product:
                        $ref: "#/components/schemas/ProductResponse"
                  - type: object
                    description: Batch (when product param is an array)
                    properties:
                      products:
                        type: array
                        items:
                          $ref: "#/components/schemas/ProductResponse"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
