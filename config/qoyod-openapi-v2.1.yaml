        - line_items
      description: >
        Required fields: contact_id, expiry_date, line_items.

        - reference is auto-generated if not provided (also accepts
        quotation_no).

        - status defaults to "Draft".

        - due_date is internally set from expiry_date.

        - terms_and_conditions also accepts terms_conditions or term_conditions.
      properties:
        contact_id:
          type: integer
          description: Customer contact ID (must be active)
          example: 1
        reference:
          type: string
          description: Auto-generated if not provided. Also accepts quotation_no.
          example: QUO-0501
        description:
          type: string
          example: Monthly services quote
        issue_date:
          type: string
          format: date
          example: 2023-12-01
        expiry_date:
          type: string
          format: date
          description: Required. Sets due_date internally.
          example: 2023-12-15
        status:
          type: string
          enum:
            - Draft
            - Approved
          default: Draft
          example: Draft
        inventory_id:
          type: integer
          description: Inventory/location ID (applied to all line items)
          example: 1
        notes:
          type: string
          example: Quote valid for 15 days
        terms_and_conditions:
          type: string
          example: Payment within 30 days of acceptance
        inclusive_cd_discount:
          type: number
          description: >
            Total CD (document-level) discount amount. When greater than 0, the
            org-level "Total CD Discount" setting must be enabled (otherwise 422
            "Total CD Discount is not enabled for this organisation."). Use with
            discount_account_id and discount_tax_id for the VAT-category flow.
          example: 10
        discount_account_id:
          type: integer
          description: >
            GL account the discount is posted to. Required when a discount is
            applied; must reference an existing account (otherwise 422).
          example: 17
        discount_tax_id:
          type: integer
          description: >
            Tax (VAT category) the discount is applied against; must reference
            an existing tax (otherwise 422). The taxable base for this tax must
            be greater than or equal to the discount amount.
          example: 2
        discount_type:
          type: string
          description: |
            Optional. Only "amount" is supported; any other value returns 422.
          enum:
            - amount
          example: amount
        discount_timing:
          type: string
          description: >
            Optional. Only "before_vat" is supported; any other value returns
            422.
          enum:
            - before_vat
          example: before_vat
        line_items:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - product_id
              - quantity
              - unit_price
            properties:
              product_id:
                type: integer
                example: 2
              quantity:
                type: string
                example: "2.0"
              unit_price:
                type: string
                example: "50.00"
              description:
                type: string
                example: Custom service
              discount_percent:
                type: string
                description: Also accepts discount or discount_percentage
                example: "10"
              discount_type:
                type: string
                enum:
                  - "0"
                  - "1"
                  - percent
                  - amount
                example: "0"
              tax_percentage:
                type: string
                description: Also accepts tax_percent. Always provide explicitly to avoid nil
                  errors.
                example: "15"
              unit_id:
                type: integer
                description: Unit type ID
                example: 1
              inventory_id:
                type: integer
                example: 1
              is_inclusive:
                type: boolean
                example: false
              inclusive_unit_price:
                type: string
                example: "57.50"
