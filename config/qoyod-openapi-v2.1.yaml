    NoteInput:
      type: object
      required:
        - contact_id
        - line_items
      description: |
        Shared input schema for credit notes and debit notes.
        - Status "Approved" is mapped to "Unused"; otherwise it becomes "Draft".
        - due_date defaults to issue_date when omitted.
        - reference is auto-generated if not provided (also accepts note_no).
        - terms_and_conditions also accepts terms_conditions or term_conditions.
      properties:
        contact_id:
          type: integer
          description: Customer (for credit note) or vendor (for debit note) contact ID.
            Must be active.
          example: 1
        parent_id:
          type: integer
          description: ID of the related invoice (for credit notes) or bill (for debit
            notes) this note is being issued against. If added,
            external_parent_reference should not be included.
          example: 789
        external_parent_reference:
          type: string
          description: reference of the related invoice (for credit notes) or bill (for
            debit notes) this note is being issued against. It can refer to
            externally created Invoice. If added, parent_id should not be
            included.
          example: INV-001
        reference:
          type: string
          description: >
            Auto-generated if not provided (also accepts note_no). If provided:
            max 25 characters, alphanumeric plus hyphens and underscores only,
            must end with a digit (0-9), and must be unique.
          example: CN-0501
        issuance_reason:
          type: string
          description: >
            Reason for issuing the credit note. Required when status is Approved
            and ZATCA Phase 2 is active. Maximum 255 characters.
          example: Product return
        issue_date:
          type: string
          format: date
          example: 2023-10-01
        due_date:
          type: string
          format: date
          description: Defaults to issue_date if not provided
          example: 2023-10-15
        supply_date:
          type: string
          format: date
          description: >
            Date of supply/delivery. Required when status is Approved and ZATCA
            e-invoicing is active (Phase 1 and Phase 2). Optional for non-ZATCA
            tenants.
          example: 2026-05-20
        status:
          type: string
          description: Approved becomes Unused; any other value becomes Draft
          enum:
            - Draft
            - Approved
          example: Draft
        inventory_id:
          type: integer
          description: Inventory/location ID (applied to all line items)
          example: 1
        notes:
          type: string
          example: Customer requested refund
        terms_and_conditions:
          type: string
          example: Refund processed within 7 days
        payment_method:
          type: integer
          description: >
            ZATCA payment means code. Optional for Phase 1 tenants. Required
            when status is Approved and ZATCA Phase 2 (Fatoora) is active.
            Accepted values: 10 (Cash), 30 (Credit), 42 (Payment to bank
            account), 48 (Bank Card), 1 (Not defined).
          enum:
            - 1
            - 10
            - 30
            - 42
            - 48
          example: 10
        contract_id:
          type: string
          description: >
            Contract reference number. Required when the contact is a B2G
            (government) customer and ZATCA e-invoicing is active (Phase 1 or
            Phase 2) with status Approved. Maximum 50 characters.
          example: W912HN-01-C-0022
        settlement_type:
          type: string
          description: >
            Jordan cash/credit settlement type (ISTD InvoiceTypeCode 012/023).
            Required at approval for invoices and credit notes in countries that
            use settlement types (currently Jordan); optional and ignored
            otherwise. Applies to credit notes; ignored (not persisted) for
            debit notes.
          enum:
            - cash
            - credit
          example: cash
        is_third_party:
          type: boolean
          example: false
        is_nominal:
          type: boolean
          example: false
        is_export:
          type: boolean
          example: false
        is_summary:
          type: boolean
          example: false
        self_billed:
          type: boolean
          example: false
        fc_currency_code:
          type: string
          description: >
            ISO 4217 foreign currency code. When provided, fc_exchange_rate must
            also be supplied. The document amounts are recorded in both the
            foreign currency and the tenant's base currency.
          example: USD
        fc_exchange_rate:
          type: string
          description: >
            Exchange rate from the foreign currency to the tenant's base
            currency. Required when fc_currency_code is provided. Accepts up to
            10 decimal places.
          example: "3.75"
        inclusive_cd_discount:
          type: number
          description: >
            Total CD (document-level) discount amount. When greater than 0, the
            org-level "Total CD Discount" setting must be enabled (otherwise 422
            "Total CD Discount is not enabled for this organisation."). Use with
            discount_account_id and discount_tax_id for the VAT-category flow.
          example: 10
        discount_account_id:
          type: integer
          description: >
            GL account the discount is posted to. Required when a discount is
            applied; must reference an existing account (otherwise 422).
          example: 17
        discount_tax_id:
          type: integer
          description: >
            Tax (VAT category) the discount is applied against; must reference
            an existing tax (otherwise 422). The taxable base for this tax must
            be greater than or equal to the discount amount.
          example: 2
        discount_type:
          type: string
          description: |
            Optional. Only "amount" is supported; any other value returns 422.
          enum:
            - amount
          example: amount
        discount_timing:
          type: string
          description: >
            Optional. Only "before_vat" is supported; any other value returns
            422.
          enum:
            - before_vat
          example: before_vat
        line_items:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - product_id
              - quantity
              - unit_price
            properties:
              product_id:
                type: integer
                description: ID of an active product in the system. Required.
                example: 2
              quantity:
                type: string
                description: >
                  Must be a positive number with up to 10 decimal places.
                  Required.
                example: "2.0"
              unit_price:
                type: string
                description: >
                  Must be a non-negative number (0 is accepted for free items)
                  with up to 10 decimal places. Required.
                example: "50.00"
              description:
                type: string
                example: Returned item
              discount_percent:
                type: string
                description: Also accepts discount or discount_percentage
                example: "10"
              discount_type:
                type: string
                description: 0 or percent = percentage, 1 or amount = fixed amount
                enum:
                  - "0"
                  - "1"
                  - percent
                  - amount
                example: "0"
              tax_percentage:
                type: string
                description: >
                  Also accepts tax_percent. If omitted, falls back to the
                  product's configured tax rate (no validation applied). If
                  provided, must be a positive number with at most 2 decimal
                  places.
                example: "15"
              tax_id:
                type: integer
                description: Auto-resolved from tax_percentage if not provided
                example: 1
              unit_id:
                type: integer
                description: Unit type ID
                example: 1
              inventory_id:
                type: integer
                example: 1
              is_inclusive:
                type: boolean
                example: false
              inclusive_unit_price:
                type: string
                description: Tax-inclusive unit price (only when is_inclusive is true)
                example: "57.50"
              project_id:
                type: integer
                example: 1
