openapi: 3.0.1
info:
  title: Qoyod API V2
  version: v2
  description: >
    Qoyod accounting software API endpoints for business documents and
    operations


    Changelog:

    - 2026-06-15 (T4-3486): Documented product `name` constraints (minLength 3,
    maxLength 250) to comply with ZATCA BT-153 (item name). Documentation only —
    no API enforcement change.

    - 2026-06-23 (T4-4093): Documented product `en_name` maxLength 250. The
    max-250 length limit is enforced server-side on both `name` and `en_name`
    (HTTP 422 on violation) across all product types.

    - 2026-06-23 (T4-4093): The BT-153 minimum of 3 characters on `name` and
    `en_name` is now enforced server-side (HTTP 422) for tenants with ZATCA
    Phase 2 active, on every entry surface. Tenants not on Phase 2 are
    unaffected. This supersedes the 2026-06-15 "documentation only" note for the
    minimum-length rule.

    - 2026-08-12 (T4-3578): Product unit types now expose `kind` (unit-type
    classification). It is accepted on `POST /2.0/product_unit_types` and
    returned by the index, show and create responses. It is optional: omitting
    it stores `null`, and unit types created before this change return `null`.

    - 2026-08-13 (T4-3579): Customers and vendors now accept `secondary_email`,
    `commission_id` and `linked_contact_id` on create and update. Vendors
    additionally accept `secondary_phone_number`, and customers additionally
    accept `is_taxed_organization` on the single-contact form (it was already
    accepted in batch). `linked_contact_id` is only stored when
    `link_to_contact` is sent alongside it, matching the web form; on its own it
    is stored as null. `currency_code` is accepted on both endpoints only while
    the `ff_multi_currencies` feature flag is on for the tenant, and is dropped
    silently when it is off. All of these are request-side only — the contact
    response payload is unchanged.

    - 2026-08-31 (T4-3574): `POST /2.0/inventory_adjustments` now returns 422
    (was 200) on validation failure. The endpoint also now accepts
    `custom_fields` and per-line-item `project_id`. `status` still defaults to
    `Completed` for headless callers.

    - 2026-08-31 (T4-3575): `POST /2.0/inventory_transfers` now returns 422 (was
    200) on validation failure. `transfer_account` is documented as required —
    omitting it returns 422 instead of silently posting against an unrelated
    account. The endpoint also now accepts `custom_fields`,
    `activity_attributes`, and per-line-item `project_id`.

    - 2026-08-31 (T4-3577): `POST /2.0/products` batch create (array payload)
    was crashing on every request and is now working; it returns 201 (was 200)
    on success and 422 (atomic — nothing written) when any entry is invalid.
    Both single and batch create now accept `product_attribute_set_id` and
    `product_inventories_attributes` (per-inventory reorder points). Providing
    an attribute set generates variants when the `PRODUCT_ATTRIBUTES` flag is on
    and the product tracks quantity; `average_price` is initialised on create
    and recalculated on update. These save-time effects are not reflected in the
    response payload.
paths:
  /2.0/accounts:
    get:
      summary: List all accounts
      tags:
        - Accounts
      description: Returns leaf accounts from the chart of accounts. Supports Ransack
        query parameters via q[] for filtering. Pagination is optional (only
        applied when both page and per_page are provided). When OAuth token has
        "account:read" scope, returns BasicPlutusAccountSerializer fields only.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Page number (pagination only applies when both page and per_page
            are provided)
          schema:
            type: integer
        - name: per_page
          in: query
          required: false
          description: Items per page
          schema:
            type: integer
        - name: q[en_name_cont]
          in: query
          required: false
          description: Filter by English name (contains)
          schema:
            type: string
        - name: q[code_eq]
          in: query
          required: false
          description: Filter by account code (exact match)
          schema:
            type: string
        - name: q[s]
          in: query
          required: false
          description: Sort order (e.g. "id asc")
          schema:
            type: string
      responses:
        "200":
          description: Accounts found
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccountResponse"
        "401":
          description: Unauthorized
        "404":
          description: No accounts found
          content:
            application/json:
              schema:
                type: string
                example: We could not retrieve your accounts, we found nothing.
    post:
      summary: Create a new account
      tags:
        - Accounts
      description: Creates a new chart of accounts entry. The parent_id is
        auto-calculated from branch_kind if not provided. type_of_account is
        auto-set based on parent_kind (Debit for assets/expense, Credit for
        others). Status is always set to Active.
      security:
        - ApiKeyAuth: []
      parameters: []
      responses:
        "201":
          description: Account created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: "#/components/schemas/AccountResponse"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInvalidResource"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - account
              properties:
                account:
                  $ref: "#/components/schemas/AccountInput"
  /2.0/accounts/{id}:
    get:
      summary: Get a specific account
      tags:
        - Accounts
      description: Returns details of a specific account. When OAuth token has
        "account:read" scope, returns BasicPlutusAccountSerializer fields only.
      parameters:
        - name: id
          in: path
          required: true
          description: Account ID
          schema:
            type: integer
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Account found
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: "#/components/schemas/AccountResponse"
        "404":
          description: Account not found
    put:
      summary: Update an account
      tags:
        - Accounts
      description: Updates an existing account. Partial payloads are supported — only
        the keys you send are changed. parent_id is NOT derived from branch_kind
        here (create only), so reclassifying an account means sending parent_id;
        any of parent_kind, branch_kind and account_kind you omit are taken from
        that new parent. Sending kinds alone, without parent_id, fails with 422
        Invalid branch. status cannot be set through this endpoint — archiving
        is a web-only action.
      parameters:
        - name: id
          in: path
          required: true
          description: Account ID
          schema:
            type: integer
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Account updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: "#/components/schemas/AccountResponse"
        "404":
          description: Account not found
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInvalidResource"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - account
              properties:
                account:
                  $ref: "#/components/schemas/AccountInput"
  /2.0/{document}/{document_id}/allocations:
    parameters:
      - name: document
        in: path
        required: true
        description: >
          Document type to allocate against:

          - invoices: allocate receipts to an invoice

          - bills: allocate receipts to a bill

          - simple_bills: allocate receipts to a simple bill

          - credit_notes: allocate receipts to a credit note

          - debit_notes: allocate receipts to a debit note

          - receipts: allocate a receipt to invoices/bills/notes (manual or
          dynamic)
        schema:
          type: string
          enum:
            - invoices
            - bills
            - simple_bills
            - credit_notes
            - debit_notes
            - receipts
      - name: document_id
        in: path
        required: true
        description: ID of the document
        schema:
          type: integer
    post:
      summary: Create a new allocation
      tags:
        - Allocations
      description: >
        Creates payment allocations between documents. Behavior depends on

        the document type:


        **For invoices/bills/simple_bills/credit_notes/debit_notes**: Wraps
        allocation

        data in the document's singular key (e.g. `{ "invoice": {
        "allocations_attributes": [...] } }`).

        Returns the updated document using its serializer. Validation failures
        return

        `422` with the record's errors.


        **For receipts**: Two modes:

        1. `allocate_dynamically: true` — auto-allocates the receipt amount
           across outstanding documents. Returns array of allocations.
        2. Manual — sends `{ "allocation": { amount, allocatee_id,
        allocatee_type } }`.
           Returns the single created allocation.

        Manual receipt allocation is rejected with `422` when:

        - `allocatee_type` is missing or is not one of the supported document
        types.

        - The target document has no remaining amount to allocate. A fully-paid
          document is still allocatable if it has a performance bond with a due
          payment — the payment is routed to the bond instead.
        - The requested amount (converted using the receipt's exchange rate)
          exceeds the receipt's unallocated balance.
      security:
        - ApiKeyAuth: []
      parameters: []
      responses:
        "200":
          description: Allocation created successfully. Response format varies by document
            type.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: 'For invoices — returns full invoice with updated payments array.
                      Root key: "invoice"'
                    properties:
                      invoice:
                        $ref: "#/components/schemas/InvoiceResponse"
                  - type: object
                    description: 'For bills — returns full bill with updated payments array. Root
                      key: "bill"'
                    properties:
                      bill:
                        $ref: "#/components/schemas/BillResponse"
                  - type: object
                    description: 'For simple_bills — returns full simple bill. Root key:
                      "simple_bill"'
                    properties:
                      simple_bill:
                        $ref: "#/components/schemas/SimpleBillResponse"
                  - type: object
                    description: 'For credit_notes — returns the updated credit note. Root key:
                      "credit_note"'
                    properties:
                      credit_note:
                        type: object
                  - type: object
                    description: 'For debit_notes — returns the updated debit note. Root key:
                      "debit_note"'
                    properties:
                      debit_note:
                        type: object
                  - type: object
                    description: For receipts (dynamic) — returns allocations array
                    properties:
                      allocations:
                        type: array
                        items:
                          $ref: "#/components/schemas/AllocationResponse"
                  - type: object
                    description: For receipts (manual) — returns single allocation
                    properties:
                      allocation:
                        $ref: "#/components/schemas/AllocationResponse"
        "422":
          description: >
            Validation failed. `errors` is always a field-keyed object whose
            values are

            arrays of messages. Keys seen on the manual receipt path:

            - `allocatee_type`: "is missing or is not a valid document type"

            - `base`: "The selected document has no remaining amount to
            allocate",
              or "Cannot allocate to the selected document"
            - `amount`: "exceeds the receipt's unallocated balance"
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                    example:
                      amount:
                        - exceeds the receipt's unallocated balance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  description: >
                    For invoices/bills/simple_bills/credit_notes/debit_notes —
                    wrap in

                    the document's singular key. Example for invoices:
                  properties:
                    invoice:
                      type: object
                      properties:
                        allocations_attributes:
                          type: array
                          minItems: 1
                          items:
                            type: object
                            required:
                              - source_id
                              - source_type
                              - amount
                              - date
                            properties:
                              source_id:
                                type: integer
                                description: Receipt ID
                                example: 42
                              source_type:
                                type: string
                                example: Receipt
                              amount:
                                type: string
                                example: "500.00"
                              date:
                                type: string
                                format: date
                                example: 2023-12-15
                - type: object
                  description: For receipts — manual allocation
                  properties:
                    allocation:
                      type: object
                      required:
                        - amount
                        - allocatee_type
                        - allocatee_id
                      properties:
                        amount:
                          type: string
                          example: "500.00"
                        allocatee_type:
                          type: string
                          description: >
                            Document type to allocate to. Required — any other
                            value

                            (or a missing one) is rejected with 422.
                            SalesDebitNote is

                            not supported by the API yet.
                          enum:
                            - Invoice
                            - Bill
                            - SimpleBill
                            - CreditNote
                            - DebitNote
                          example: Invoice
                        allocatee_id:
                          type: integer
                          example: 123
                        date:
                          type: string
                          format: date
                          example: 2023-12-15
                    allocate_dynamically:
                      type: boolean
                      description: Set to true to auto-allocate across outstanding documents (ignores
                        other allocation fields)
                      example: false
  /2.0/bill_payments:
    get:
      summary: List all bill payments
      tags:
        - Bill Payments
      description: >
        Returns the tenant's paid receipts (kind=paid), one page at a time. Uses

        Receipt model with .paid_payments scope. Supports Ransack query

        parameters via q[]. Root key is "receipts".


        **Paginated (default 100 per page, maximum 100).** This endpoint

        previously returned every bill payment in a single response; it now
        pages

        like /2.0/receipts and /2.0/invoice_payments. A caller that reads

        `receipts` and stops will see only the first 100 rows.


        The `pagination` object is always present and always reports `total`,
        the

        count across all pages. Compare it with `count`: a truncated page is

        otherwise indistinguishable from a complete result. Walk `page` until

        `currentPage` reaches `totalPages` to retrieve the full set.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: per_page
          in: query
          required: false
          description: Rows per page (default 100, maximum 100)
          schema:
            type: integer
        - name: page
          in: query
          required: false
          description: Page number (default 1)
          schema:
            type: integer
        - name: q[contact_id_eq]
          in: query
          required: false
          description: Filter by vendor contact ID
          schema:
            type: integer
        - name: q[s]
          in: query
          required: false
          description: Sort order (default "id asc")
          schema:
            type: string
      responses:
        "200":
          description: Bill payments found
          content:
            application/json:
              schema:
                type: object
                properties:
                  receipts:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReceiptResponse"
                  pagination:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          description: Unauthorized
    post:
      summary: Create a new bill payment
      tags:
        - Bill Payments
      description: >
        Records a payment against a bill. Requires bill_id pointing to a
        non-Draft

        bill. The server automatically sets contact_id from the bill,
        kind="paid",

        is_receipt=true, and creates the allocation. Bill must NOT be in Draft
        or

        "Awaiting for approval" status.

        Response root key is "payment".
      security:
        - ApiKeyAuth: []
      parameters: []
      responses:
        "200":
          description: Bill payment created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment:
                    $ref: "#/components/schemas/ReceiptResponse"
        "422":
          description: Validation failed or bill is in Draft status
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      errors:
                        type: string
                        example: Cannot pay Draft bill
                  - $ref: "#/components/schemas/ReceiptInvalidResource"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bill_payment
              properties:
                bill_payment:
                  type: object
                  required:
                    - bill_id
                    - amount
                    - account_id
                    - date
                  properties:
                    bill_id:
                      type: integer
                      description: Bill being paid (must be non-Draft)
                      example: 8
                    amount:
                      type: string
                      example: "200.00"
                    account_id:
                      type: integer
                      description: Bank/cash account being debited
                      example: 1
                    date:
                      type: string
                      format: date
                      example: 2023-12-15
                    reference:
                      type: string
                      example: BP-0501
                    description:
                      type: string
                      example: Payment for bill BILL-001
  /2.0/bill_payments/{id}:
    get:
      summary: Get a specific bill payment
      tags:
        - Bill Payments
      description: Returns details of a specific bill payment.
      parameters:
        - name: id
          in: path
          required: true
          description: Receipt ID (bill payment is a Receipt record)
          schema:
            type: integer
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Bill payment found
          content:
            application/json:
              schema:
                type: object
                properties:
                  receipt:
                    $ref: "#/components/schemas/ReceiptResponse"
        "404":
          description: Bill payment not found
  /2.0/bills:
    get:
      summary: List all bills
      tags:
        - Bills
      description: Returns a paginated list of all vendor bills. Uses will_paginate
        (default 100 per page). Supports Ransack query parameters via q[].
      security:
        - ApiKeyAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Page number (default 1)
          schema:
            type: integer
        - name: per_page
          in: query
          required: false
          description: Items per page (default 100)
          schema:
            type: integer
        - name: q[status_eq]
          in: query
          required: false
          description: Filter by status
          schema:
            type: string
        - name: q[contact_id_eq]
          in: query
          required: false
          description: Filter by vendor contact ID
          schema:
            type: integer
        - name: q[s]
          in: query
          required: false
          description: Sort order (e.g. "id asc")
          schema:
            type: string
      responses:
        "200":
          description: Bills found
          content:
            application/json:
              schema:
                type: object
                properties:
                  bills:
                    type: array
                    items:
                      $ref: "#/components/schemas/BillResponse"
        "401":
          description: Unauthorized
        "404":
          description: No bills found
          content:
            application/json:
              schema:
                type: string
                example: We could not retrieve your Bills, we found nothing.
    post:
      summary: Create a new bill
      tags:
        - Bills
      description: Creates a new vendor bill with line items. Reference is
        auto-generated if not provided. Status defaults to Draft. Accounting
        transactions are created automatically for non-draft bills.
      security:
        - ApiKeyAuth: []
      parameters: []
      responses:
        "201":
          description: Bill created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  bill:
                    $ref: "#/components/schemas/BillResponse"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bill
              properties:
                bill:
                  $ref: "#/components/schemas/BillInput"
  /2.0/bills/{id}:
    get:
      summary: Get a specific bill
      tags:
        - Bills
      description: Returns details of a specific bill including line items, payments,
        and contact.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Bill ID
          schema:
            type: integer
      responses:
        "200":
          description: Bill found
          content:
            application/json:
              schema:
                type: object
                properties:
                  bill:
                    $ref: "#/components/schemas/BillResponse"
        "404":
          description: Bill not found
          content:
            application/json:
              schema:
                type: string
                example: We found nothing
    put:
      summary: Update a bill
      tags:
        - Bills
      description: Updates an existing bill. Only Draft or "Awaiting for approval"
        bills can be updated. Note that line_items cannot be individually
        updated (item IDs are not accepted). Passing line_items on update will
        create new items, not modify existing ones.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Bill ID
          schema:
            type: integer
      responses:
        "200":
          description: Bill updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  bill:
                    $ref: "#/components/schemas/BillResponse"
        "422":
          description: Validation failed or bill is not in draft status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bill
              properties:
                bill:
                  type: object
                  description: Only header fields can be reliably updated.
                  properties:
                    contact_id:
                      type: integer
                      description: Vendor contact ID
                      example: 1
                    reference:
                      type: string
                      example: BILL-001-UPDATED
                    description:
                      type: string
                      example: Updated bill description
                    issue_date:
                      type: string
                      format: date
                      example: 2023-12-01
                    due_date:
                      type: string
                      format: date
                      example: 2023-12-30
                    status:
                      type: string
                      enum:
                        - Draft
                        - Approved
                      example: Draft
                    notes:
                      type: string
                      example: Updated notes
                    terms_and_conditions:
                      type: string
                      example: Net 30 payment terms
  /2.0/categories:
    get:
      summary: List all categories
      tags:
        - Categories
      description: Returns a list of all product categories. Supports Ransack query
        parameters via q[]. No pagination.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: q[name_cont]
          in: query
          required: false
          description: Filter by name (contains)
          schema:
            type: string
        - name: q[parent_id_eq]
          in: query
          required: false
          description: Filter by parent category ID
          schema:
            type: integer
        - name: q[level_eq]
          in: query
          required: false
          description: Filter by depth. 0 for a root category, 1 for one with a parent.
            Not returned by the serializer, so this filter is the only way to
            observe it.
          schema:
            type: integer
            enum:
              - 0
              - 1
        - name: q[s]
          in: query
          required: false
          description: Sort order (e.g. "id asc")
          schema:
            type: string
      responses:
        "200":
          description: Categories found
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      $ref: "#/components/schemas/CategoryResponse"
        "401":
          description: Unauthorized
        "404":
          description: No categories found
          content:
            application/json:
              schema:
                type: string
                example: We could not retrieve your categories, we found nothing.
    post:
      summary: Create a new category
      tags:
        - Categories
      description: Creates a new product category. Accepts single object or array for
        batch creation. Level is auto-set based on parent_id.
      security:
        - ApiKeyAuth: []
      parameters: []
      responses:
        "201":
          description: Category created successfully. A single-object payload returns
            `category`; an array payload returns `categories`. An array payload
            is created atomically, so a single invalid entry writes no rows at
            all. An empty array creates nothing and returns an empty
            `categories` list.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      category:
                        $ref: "#/components/schemas/CategoryResponse"
                  - type: object
                    properties:
                      categories:
                        type: array
                        items:
                          $ref: "#/components/schemas/CategoryResponse"
        "422":
          description: Validation failed, or the payload could not be processed. `errors`
            is an object keyed by field name for a validation failure, and a
            plain string for a missing or malformed payload. Field messages are
            localised by the `LOCALE` request header, which defaults to Arabic.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    oneOf:
                      - type: object
                        additionalProperties:
                          type: array
                          items:
                            type: string
                        example:
                          name:
                            - Can't be blank
                          parent_id:
                            - does not exist
                      - type: string
                        example: category must be an array of objects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - category
              properties:
                category:
                  $ref: "#/components/schemas/CategoryInput"
