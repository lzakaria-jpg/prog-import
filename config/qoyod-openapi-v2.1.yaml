  /2.0/special_tax_reasons:
    get:
      summary: List all special tax reasons
      tags:
        - Special Tax Reasons
      description: |
        Returns the tenant's special tax reasons. Read-only and unpaginated —
        this is a small seeded lookup table. Returns 200 with an empty array
        when there are none.

        `category` holds a TAX CODE ("Z", "E" or "O"), not a product category.
        Creating a product whose tax requires an exemption reason is rejected
        unless the reason's `category` equals the tax's `code`, so filter with
        `q[category_eq]=<the tax's code>` before offering a choice.

        Reasons are seeded per country: KSA has 11 reasons for `Z` and 3 for
        `E`; Jordan requires none and returns an empty list.

        `display_reason` is localised via the `LOCALE` request header (default
        `en`). `reason` is the untranslated key and does not vary. Not-subject
        (`O`) rows carry free text typed by a user rather than a key, so their
        `display_reason` is returned verbatim in whatever language it was
        written — there is nothing to translate.

        Only the `q` keys listed below are honoured; any other key is **ignored
        silently**, returning the unfiltered set rather than an error. Check the
        spelling of a filter before treating an unexpected result as data.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: LOCALE
          in: header
          required: false
          description: Response language for display_reason (default "en")
          schema:
            type: string
            enum:
              - en
              - ar
        - name: q[category_eq]
          in: query
          required: false
          description: Filter by tax code the reason is valid for (Z, E or O)
          schema:
            type: string
            enum:
              - Z
              - E
              - O
        - name: q[code_eq]
          in: query
          required: false
          description: Filter by ZATCA reason code (e.g. VATEX-SA-32)
          schema:
            type: string
        - name: q[s]
          in: query
          required: false
          description: Sort order (default "id asc")
          schema:
            type: string
      responses:
        "200":
          description: Special tax reasons found (may be an empty list)
          content:
            application/json:
              schema:
                type: object
                properties:
                  special_tax_reasons:
                    type: array
                    items:
                      $ref: "#/components/schemas/SpecialTaxReasonResponse"
        "401":
          description: Unauthorized
  /2.0/special_tax_reasons/{id}:
    get:
      summary: Get a specific special tax reason
      tags:
        - Special Tax Reasons
      description: Returns details of a specific special tax reason.
      parameters:
        - name: id
          in: path
          required: true
          description: Special tax reason ID
          schema:
            type: integer
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Special tax reason found
          content:
            application/json:
              schema:
                type: object
                properties:
                  special_tax_reason:
                    $ref: "#/components/schemas/SpecialTaxReasonResponse"
        "404":
          description: Special tax reason not found
  /2.0/taxes:
    get:
      summary: List all taxes
      tags:
        - Taxes
      description: |
        Returns the tenant's taxes. Read-only. Returns 200 with an empty array
        when there are none.

        Use this to obtain the `tax_id` that creating a product requires.

        **`code` is not portable across countries.** In KSA `Z` is zero-rated,
        `E` is exempt and `O` is not-subject. In Jordan `Z` is exempt and `O` is
        zero-rate, and three separate taxes share the code `S` at 16%, 10% and
        4%. Select on `percentage` and `name_en`/`name_ar`, never by
        interpreting the letter.

        When a tax requires an exemption reason (KSA `Z` and `E`), also send
        `special_tax_reason_id` — see GET /2.0/special_tax_reasons.

        **Known limitation:** a KSA tax with code `O` also requires a reason,
        but no `O` reasons are seeded and the free-text reason can only be
        authored in the Qoyod web UI. A fresh KSA tenant has no `O` tax, so this
        arises only for a manually created one.

        `name_en` and `name_ar` are stored columns, not translations: both are
        always returned regardless of the `LOCALE` header, so a consumer picks
        the one it needs.

        Paginated (default 100 per page, maximum 500). The tenant UI allows
        creating taxes, so this table is user-grown and unbounded. The
        `pagination` object is always present and always reports `total`, so a
        truncated page can never be mistaken for the full set — check
        `totalPages` before concluding a tax does not exist.

        Only the `q` keys listed below are honoured; any other key is **ignored
        silently**, returning the unfiltered set rather than an error. Check the
        spelling of a filter before treating an unexpected result as data.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: per_page
          in: query
          required: false
          description: Rows per page (default 100)
          schema:
            type: integer
        - name: page
          in: query
          required: false
          description: Page number (default 1)
          schema:
            type: integer
        - name: q[code_eq]
          in: query
          required: false
          description: Filter by tax code (S, Z, E or O)
          schema:
            type: string
            enum:
              - S
              - Z
              - E
              - O
        - name: q[english_name_cont]
          in: query
          required: false
          description: Filter by English name (contains)
          schema:
            type: string
        - name: q[s]
          in: query
          required: false
          description: Sort order (default "id asc")
          schema:
            type: string
      responses:
        "200":
          description: Taxes found (may be an empty list)
          content:
            application/json:
              schema:
                type: object
                properties:
                  taxes:
                    type: array
                    items:
                      $ref: "#/components/schemas/TaxResponse"
                  pagination:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          description: Unauthorized
  /2.0/taxes/{id}:
    get:
      summary: Get a specific tax
      tags:
        - Taxes
      description: Returns details of a specific tax.
      parameters:
        - name: id
          in: path
          required: true
          description: Tax ID
          schema:
            type: integer
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Tax found
          content:
            application/json:
              schema:
                type: object
                properties:
                  tax:
                    $ref: "#/components/schemas/TaxResponse"
        "404":
          description: Tax not found
  /2.0/tenant_users:
    get:
      summary: List all tenant users
      tags:
        - Tenant Users
      description: |
        Returns a paginated list of tenant users. Uses will_paginate.
        Supports Ransack query parameters via q[]. By default returns
        non-service users only. Use all_users=true to include all, or
        qoyod_service=true for service users only.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Page number (default 1)
          schema:
            type: integer
        - name: per_page
          in: query
          required: false
          description: Items per page (default 100)
          schema:
            type: integer
        - name: all_users
          in: query
          required: false
          description: Include all users (including service users)
          schema:
            type: boolean
        - name: qoyod_service
          in: query
          required: false
          description: Return only service users
          schema:
            type: boolean
        - name: q[first_name_cont]
          in: query
          required: false
          description: Filter by first name (contains)
          schema:
            type: string
        - name: q[email_cont]
          in: query
          required: false
          description: Filter by email (contains)
          schema:
            type: string
        - name: q[s]
          in: query
          required: false
          description: Sort order (default "id asc")
          schema:
            type: string
      responses:
        "200":
          description: Tenant users found
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_users:
                    type: array
                    items:
                      $ref: "#/components/schemas/TenantUserResponse"
        "401":
          description: Unauthorized
        "404":
          description: No tenant users found
          content:
            application/json:
              schema:
                type: string
                example: We could not retrieve your tenant users, we found nothing.
  /2.0/tenant_users/{id}:
    get:
      summary: Get a specific tenant user
      tags:
        - Tenant Users
      description: Returns details of a specific tenant user.
      parameters:
        - name: id
          in: path
          required: true
          description: Tenant User ID
          schema:
            type: integer
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Tenant user found
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_user:
                    $ref: "#/components/schemas/TenantUserResponse"
        "404":
          description: Tenant user not found
          content:
            application/json:
              schema:
                type: string
                example: Tenant User Not Found
  /2.0/vendors:
    get:
      summary: List all vendors
      tags:
        - Vendors
      description: Returns a list of all vendor contacts. Supports Ransack query
        parameters via q[] for filtering.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: q[contact_name_cont]
          in: query
          required: false
          description: Filter by vendor name (contains)
          schema:
            type: string
        - name: q[primary_email_cont]
          in: query
          required: false
          description: Filter by vendor email (contains)
          schema:
            type: string
        - name: q[s]
          in: query
          required: false
          description: Sort order (e.g. "id asc", "contact_name desc")
          schema:
            type: string
      responses:
        "200":
          description: Vendors found
          content:
            application/json:
              schema:
                type: object
                properties:
                  vendors:
                    type: array
                    items:
                      $ref: "#/components/schemas/ContactResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized - Invalid API key
        "404":
          description: No vendors found
          content:
            application/json:
              schema:
                type: string
                example: We could not retrieve your vendors, we found nothing.
    post:
      summary: Create a new vendor
      tags:
        - Vendors
      description: Creates a new vendor contact. Accepts a single contact object or an
        array for batch creation.
      security:
        - ApiKeyAuth: []
      parameters: []
      responses:
        "200":
          description: Batch vendors created (when contact param is an array)
          content:
            application/json:
              schema:
                type: object
                properties:
                  vendors:
                    type: array
                    items:
                      $ref: "#/components/schemas/ContactResponse"
        "201":
          description: Vendor created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  contact:
                    $ref: "#/components/schemas/ContactResponse"
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contact
              properties:
                contact:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Vendor full name (mapped to contact_name)
                      example: Ahmed Al-Rahman
                    organization:
                      type: string
                      description: Company name (mapped to organization_name)
                      example: Al-Rahman Supplies Ltd
                    email:
                      type: string
                      description: Primary email (mapped to primary_email)
                      example: ahmed@alrahman.com
                    phone_number:
                      type: string
                      description: Primary phone (mapped to primary_contact_number)
                      example: "+966501234567"
                    tax_number:
                      type: string
                      example: "312345678912343"
                    status:
                      type: string
                      enum:
                        - Active
                        - Inactive
                      example: Active
                    secondary_phone_number:
                      type: string
                      description: Secondary phone (mapped to secondary_contact_number)
                      example: "+966507654321"
                    secondary_email:
                      type: string
                      description: Secondary email address
                      example: accounts@alrahman.com
                    commission_id:
                      type: integer
                      description: Sales commission scheme to attach to this contact. Must reference
                        an existing commission.
                      example: 7
                    linked_contact_id:
                      type: integer
                      description: >
                        Links this vendor to another contact record, for a party
                        that

                        exists as both a customer and a vendor. Only applied
                        when

                        link_to_contact is sent as well; otherwise it is stored
                        as null.

                        A contact already linked to a different record returns
                        422.
                      example: 2184
                    link_to_contact:
                      type: string
                      description: >
                        Confirms linked_contact_id, mirroring the "link to
                        contact"

                        checkbox on the web form. Send any non-blank value to
                        keep

                        linked_contact_id; omit it and linked_contact_id is
                        stored as

                        null. Never persisted itself.
                      example: "1"
                    currency_code:
                      type: string
                      description: >
                        Default currency for this vendor, as a currency code
                        present in

                        the tenant's currency list. Only accepted while the

                        ff_multi_currencies feature flag is on for the tenant;
                        with the

                        flag off the field is dropped silently and no currency
                        is set.
                      example: EUR
                    billing_address_attributes:
                      type: object
                      properties:
                        billing_address:
                          type: string
                          description: Street address
                          example: 456 Industrial St
                        billing_city:
                          type: string
                          example: Dammam
                        billing_state:
                          type: string
                          example: Eastern Province
                        billing_zip:
                          type: string
                          description: Must be exactly 5 digits when billing_country is Saudi Arabia and
                            ZATCA is active
                          example: "31411"
                        billing_country:
                          type: string
                          description: Country name or ISO alpha-2 code
                          example: Saudi Arabia
                    shipping_address_attributes:
                      type: object
                      properties:
                        shipping_address:
                          type: string
                          description: Street address
                          example: 789 Delivery Ave
                        shipping_city:
                          type: string
                          example: Riyadh
                        shipping_state:
                          type: string
                          example: Riyadh Province
                        shipping_zip:
                          type: string
                          example: "11564"
                        shipping_country:
                          type: string
                          example: Saudi Arabia
