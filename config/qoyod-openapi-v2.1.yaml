servers:
  - url: https://api.qoyod.com
    description: Production server
  - url: https://sandbox.qoyod.com/api
    description: Sandbox server (for external developers)
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: API-KEY
  schemas:
    ContactResponse:
      type: object
      properties:
        id:
          type: integer
          example: 123
        name:
          type: string
          description: Contact name (mapped from contact_name)
          example: Ahmed Al-Rahman
        organization:
          type: string
          description: Organization name (mapped from organization_name)
          example: Al-Rahman Supplies Ltd
        status:
          type: string
          example: Active
          enum:
            - Active
            - Inactive
        email:
          type: string
          description: Primary email (mapped from primary_email)
          example: ahmed@alrahman.com
        phone_number:
          type: string
          description: Primary phone (mapped from primary_contact_number)
          example: "+966501234567"
        secondary_phone_number:
          type: string
          description: Secondary phone (mapped from secondary_contact_number)
          example: "+966507654321"
        tax_number:
          type: string
          example: "123456789012345"
        custom_fields:
          type: object
          description: Key-value pairs of custom field names to values
          additionalProperties:
            type: string
        website:
          type: string
          example: https://alrahman.com
        pos:
          type: boolean
          example: true
        government_entity:
          type: boolean
          example: false
        billing_address:
          $ref: "#/components/schemas/BillingAddress"
        shipping_address:
          $ref: "#/components/schemas/ShippingAddress"
        bank:
          $ref: "#/components/schemas/Bank"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BillingAddress:
      type: object
      nullable: true
      properties:
        id:
          type: integer
        billing_address:
          type: string
          description: Street address
          example: 456 Industrial St
        billing_city:
          type: string
          example: Dammam
        billing_state:
          type: string
          example: Eastern Province
        billing_zip:
          type: string
          example: "31411"
        billing_country:
          type: string
          example: Saudi Arabia
        building_number:
          type: string
          example: "1234"
        is_default:
          type: boolean
          nullable: true
        contact_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ShippingAddress:
      type: object
      nullable: true
      properties:
        id:
          type: integer
        shipping_address:
          type: string
          description: Street address
          example: 789 Delivery Ave
        shipping_city:
          type: string
          example: Riyadh
        shipping_state:
          type: string
          example: Riyadh Province
        shipping_zip:
          type: string
          example: "11564"
        shipping_country:
          type: string
          example: Saudi Arabia
        shipping_building_number:
          type: string
          example: "5678"
        is_default:
          type: boolean
          nullable: true
        contact_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Bank:
      type: object
      nullable: true
      properties:
        id:
          type: integer
        name:
          type: string
          example: Al Rajhi Bank
        account_name:
          type: string
          example: Al-Rahman Supplies
        account_number:
          type: string
          example: "1234567890"
        iban:
          type: string
          example: SA0380000000608010167519
        swift_code:
          type: string
          example: RJHISARI
        address:
          type: string
          example: King Fahd Road
        country:
          type: string
          example: Saudi Arabia
        currency:
          type: string
          example: SAR
        contact_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      description: >
        Standard validation error response from create_resource/update_resource.

        Returns a field-to-messages map where each key is a failing attribute
        and

        each value is an array of error messages. The exact field names depend
        on

        the resource being validated (e.g. contact_name on customers/vendors,

        en_name on accounts, reference on invoices/bills).
      properties:
        errors:
          type: object
          description: Field-level validation errors (field names vary per resource)
          additionalProperties:
            type: array
            items:
              type: string
          example:
            field_name:
              - can't be blank
            another_field:
              - is invalid
    ErrorInvalidResource:
      type: object
      description: Error response from accounts endpoints using invalid_resource!
      properties:
        error:
          type: string
          example: Invalid resource
        messages:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            en_name:
              - Can't be blank
            account_kind:
              - Can't be blank
    ReceiptInvalidResource:
      type: object
      description: Error response for receipts and payment endpoints using invalid_resource!
      properties:
        error:
          type: string
          example: Invalid resource
        messages:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            amount:
              - Can't be blank
            account_id:
              - Can't be blank
            contact_id:
              - must exist
    NotFoundResponse:
      type: object
      description: Standard 404 response from api/errors/not_found.json.rabl. The
        "<model>" is replaced with the lowercase model name (e.g. "receipt",
        "invoice", "bill").
      properties:
        message:
          type: string
          example: Invalid receipt ID. Please provide a valid receipt ID.
    AccountResponse:
      type: object
      description: Full account response (PlutusAccountSerializer). When OAuth scope
        is "account:read", only BasicPlutusAccountSerializer fields are returned
        (id, code, name_en, name_ar, type, group_type, status, account_nature,
        deferral_template_id).
      properties:
        id:
          type: integer
          example: 123
        code:
          type: string
          description: Account code
          example: "1001"
        name_en:
          type: string
          description: English name (mapped from en_name)
          example: Cash in Bank
        name_ar:
          type: string
          description: Arabic name (mapped from ar_name)
          example: النقد في البنك
        type:
          type: string
          description: Account type derived from account_kind
          example: Asset
        group_type:
          type: string
          description: Localized group type label
          example: Current Assets
        status:
          type: string
          example: Active
        account_nature:
          type: string
          description: Localized account nature
          example: Debit
        deferral_template_id:
          type: integer
          nullable: true
          description: Only included when deferral templates feature is enabled
        type_of_account:
          type: string
          description: Debit or Credit (only in full serializer)
          example: Debit
          enum:
            - Debit
            - Credit
        parent_type:
          type: string
          description: Parent's parent_kind singularized and camelized (only in full
            serializer)
          example: Asset
        balance:
          type: number
          description: Account balance rounded to 2 decimals (only in full serializer)
          example: 25000
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
