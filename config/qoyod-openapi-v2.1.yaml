    JournalEntryInput:
      type: object
      description: >
        Journal entries require balanced debit and credit amounts. Each amount

        requires account_id and amount. The sum of debit amounts must equal the

        sum of credit amounts.

        - account_id=9 (accounts_receivable) with contact_id → links to a
