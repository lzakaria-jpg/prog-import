      description: Creates a new product. Accepts a single object or an array for
        batch creation; both return 201. A batch is atomic — if any entry is
        invalid the whole request returns 422 and nothing is written. Type
        defaults to "Product". track_quantity defaults to 0. Requires "Products
        > advanced" permission for RawMaterial/Recipe types. Requires "Track
        Products > read" for tracked products.
      security:
        - ApiKeyAuth: []
