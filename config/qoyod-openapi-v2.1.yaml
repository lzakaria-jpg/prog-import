            The document type this payment is allocated to. Pairs with the
            parent

            receipt's kind:

            - kind=received → Invoice (customer paying you)

            - kind=paid → Bill or SimpleBill (you paying a vendor)

            - CreditNote / DebitNote allocations are also possible
          enum:
            - Invoice
            - Bill
            - SimpleBill
            - CreditNote
            - DebitNote
