          example: Monthly depreciation adjustment
        date:
          type: string
          format: date
          description: Entry date (stored internally as journal_entry_date)
          example: 2023-12-31
        inventory_id:
          type: integer
          description: Optional default inventory for all amounts
          example: 1
        debit_amounts:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - account_id
              - amount
            properties:
              account_id:
                type: integer
