        - ApiKeyAuth: []
      responses:
        "200":
          description: Invoice found
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoice:
                    $ref: "#/components/schemas/InvoiceResponse"
        "404":
          description: Invoice not found
          content:
            application/json:
              schema:
                type: string
                example: We found nothing
    put:
      summary: Update an invoice
      tags:
        - Invoices
      description: Updates an existing invoice. Only Draft or "Awaiting for approval"
        invoices can be updated. Note that line_items cannot be individually
        updated (item IDs are not accepted). Passing line_items on update will
        create new items, not modify existing ones.
      parameters:
        - name: id
          in: path
          required: true
          description: Invoice ID
          schema:
            type: integer
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Invoice updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoice:
                    $ref: "#/components/schemas/InvoiceResponse"
        "422":
          description: Validation failed or invoice is not in draft status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - invoice
              properties:
                invoice:
                  type: object
                  description: Only header fields can be reliably updated. Line items do not
                    support individual updates (no item ID is accepted).
                  properties:
                    contact_id:
                      type: integer
                      description: Customer contact ID
                      example: 456
                    reference:
                      type: string
                      example: INV-001-UPDATED
                    description:
                      type: string
                      example: Updated invoice description
                    issue_date:
                      type: string
                      format: date
                      example: 2023-12-01
                    due_date:
                      type: string
                      format: date
                      example: 2023-12-20
                    status:
                      type: string
                      enum:
                        - Draft
                        - Approved
                      example: Draft
                    notes:
                      type: string
                      example: Updated notes
                    terms_and_conditions:
                      type: string
                      example: Net 30 payment terms
                    payment_method:
                      type: integer
                      example: 10
                    contract_id:
                      type: string
                      description: Required for B2G invoices
                      example: W912HN-01-C-0022
                    settlement_type:
                      type: string
                      description: >
                        Jordan cash/credit settlement type (ISTD InvoiceTypeCode
                        012/023). Required at approval for invoices and credit
                        notes in countries that use settlement types (currently
                        Jordan); optional and ignored otherwise.
                      enum:
                        - cash
                        - credit
                      example: cash
