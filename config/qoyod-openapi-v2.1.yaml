                example: 12
              amount:
                type: string
                example: "2500.00"
              comment:
                type: string
                example: Depreciation expense for Q4
              inventory_id:
                type: integer
                example: 1
              project_id:
                type: integer
                nullable: true
                example: null
              contact_id:
                type: integer
                description: Required when account_id=9 (customer) or account_id=14 (vendor)
                example: 42
        credit_amounts:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - account_id
              - amount
            properties:
              account_id:
                type: integer
                description: Chart of accounts ID (must exist)
                example: 12
              amount:
                type: string
                example: "2500.00"
              comment:
                type: string
                example: Accumulated depreciation
              inventory_id:
                type: integer
                example: 1
              project_id:
                type: integer
                nullable: true
                example: null
              contact_id:
                type: integer
                description: Required when account_id=9 (customer) or account_id=14 (vendor)
                example: 42
