          description: Customer balance retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer_balance:
                    type: object
                    properties:
                      balance:
                        type: string
                        example: "1500.00"
                      total_outstanding:
                        type: string
                        example: "2000.00"
                      overdue_amount:
                        type: string
                        example: "500.00"
                      count_of_all_invoices:
                        type: integer
                        example: 12
                      sum_amount_of_all_invoices:
                        type: string
                        example: "15000.00"
        "404":
          description: Customer not found
          content:
            application/json:
              schema:
                type: string
                example: Customer Not Found
  /2.0/credit_notes:
    get:
      summary: List all credit notes
      tags:
        - Credit Notes
      description: Returns a paginated list of credit notes. Uses will_paginate
        (default 100 per page). Supports Ransack query parameters via q[].
      security:
        - ApiKeyAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Page number (default 1)
          schema:
            type: integer
        - name: per_page
          in: query
          required: false
          description: Items per page (default 100)
          schema:
            type: integer
        - name: q[status_eq]
          in: query
          required: false
          description: Filter by status
          schema:
            type: string
        - name: q[contact_id_eq]
          in: query
          required: false
          description: Filter by contact ID
          schema:
            type: integer
        - name: q[s]
          in: query
          required: false
          description: Sort order (e.g. "id asc")
          schema:
            type: string
      responses:
        "200":
          description: Credit notes found
          content:
            application/json:
              schema:
                type: object
                properties:
                  credit_notes:
                    type: array
                    items:
                      $ref: "#/components/schemas/NoteResponse"
        "401":
          description: Unauthorized
        "404":
          description: No credit notes found
          content:
            application/json:
              schema:
                type: string
                example: We could not retrieve your Credit notes, we found nothing.
    post:
      summary: Create a new credit note
      tags:
        - Credit Notes
      description: Creates a new credit note. Reference is auto-generated if not
        provided. Status "Approved" is mapped to "Unused". Non-draft credit
        notes trigger accounting transactions and ZATCA reporting (if ZATCA is
        activated).
      security:
        - ApiKeyAuth: []
      parameters: []
      responses:
        "201":
          description: Credit note created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  note:
                    $ref: "#/components/schemas/NoteResponse"
        "422":
          description: Validation failed. Pre-validation errors come back as a plain array
            of messages. Model-level errors come back as a field-keyed object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    oneOf:
                      - type: array
                        description: Pre-validation error messages (contact missing, line items
                          missing/invalid, etc.)
                        items:
                          type: string
                        example:
                          - contact id is missing
                          - 'invalid line_items json body - expecting {
                            "credit_note" : { ... line_items: [ {...}, ... ] }}'
                      - type: object
                        description: Model validation errors (field → messages)
                        additionalProperties:
                          type: array
                          items:
                            type: string
                        example:
                          reference:
                            - has already been taken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - credit_note
              properties:
                credit_note:
                  $ref: "#/components/schemas/NoteInput"
  /2.0/credit_notes/{id}:
    get:
      summary: Get a specific credit note
      tags:
        - Credit Notes
      description: Returns details of a specific credit note including line items and
        ZATCA details.
      parameters:
        - name: id
          in: path
          required: true
          description: Credit Note ID
          schema:
            type: integer
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Credit note found
          content:
            application/json:
              schema:
                type: object
                properties:
                  note:
                    $ref: "#/components/schemas/NoteResponse"
        "404":
          description: Credit note not found
          content:
            application/json:
              schema:
                type: string
                example: We found nothing
    put:
      summary: Update a credit note
      tags:
        - Credit Notes
      description: Updates an existing credit note. Only Draft or "Awaiting for
        approval" notes can be updated. Note that line_items cannot be
        individually updated (item IDs are not accepted). Passing line_items on
        update will create new items, not modify existing ones.
      parameters:
        - name: id
          in: path
          required: true
          description: Credit Note ID
          schema:
            type: integer
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Credit note updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  note:
                    $ref: "#/components/schemas/NoteResponse"
        "422":
          description: Validation failed or note is not in draft status
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    oneOf:
                      - type: object
                        additionalProperties:
                          type: array
                          items:
                            type: string
                      - type: string
                        example: Not update other than draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - credit_note
              properties:
                credit_note:
                  type: object
                  description: Only header fields can be reliably updated.
                  properties:
                    contact_id:
                      type: integer
                      example: 1
                    reference:
                      type: string
                      example: CN-0501-UPDATED
                    issuance_reason:
                      type: string
                      example: Updated reason
                    issue_date:
                      type: string
                      format: date
                      example: 2023-10-01
                    due_date:
                      type: string
                      format: date
                      example: 2023-10-20
                    status:
                      type: string
                      enum:
                        - Draft
                        - Approved
                      example: Draft
                    notes:
                      type: string
                      example: Updated notes
                    terms_and_conditions:
                      type: string
                      example: Updated terms
                    payment_method:
                      type: integer
                      example: 10
                    contract_id:
                      type: string
                      example: W912HN-01-C-0022
                    settlement_type:
                      type: string
                      description: >
                        Jordan cash/credit settlement type (ISTD InvoiceTypeCode
                        012/023). Required at approval for invoices and credit
                        notes in countries that use settlement types (currently
                        Jordan); optional and ignored otherwise.
                      enum:
                        - cash
                        - credit
                      example: cash
    delete:
      summary: Delete a credit note
      tags:
        - Credit Notes
      description: Deletes a credit note by ID.
      parameters:
        - name: id
          in: path
          required: true
          description: Credit Note ID
          schema:
            type: integer
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Credit note deleted successfully
          content:
            application/json:
              schema:
                type: string
                example: Credit note destroyed successfully
        "404":
          description: Credit note not found
          content:
            application/json:
              schema:
                type: string
                example: Credit note not found
        "422":
          description: Credit note could not be destroyed
          content:
            application/json:
              schema:
                type: string
                example: Credit note couldn't be destroyed
  /2.0/debit_notes:
    get:
      summary: List all debit notes
      tags:
        - Debit Notes
      description: Returns a paginated list of debit notes. Uses will_paginate
        (default 100 per page). Supports Ransack query parameters via q[].
      security:
        - ApiKeyAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Page number (default 1)
          schema:
            type: integer
        - name: per_page
          in: query
          required: false
          description: Items per page (default 100)
          schema:
            type: integer
        - name: q[status_eq]
          in: query
          required: false
          description: Filter by status
          schema:
            type: string
        - name: q[contact_id_eq]
          in: query
          required: false
          description: Filter by vendor contact ID
          schema:
            type: integer
        - name: q[s]
          in: query
          required: false
          description: Sort order (e.g. "id asc")
          schema:
            type: string
      responses:
        "200":
          description: Debit notes found
          content:
            application/json:
              schema:
                type: object
                properties:
                  debit_notes:
                    type: array
                    items:
                      $ref: "#/components/schemas/NoteResponse"
        "401":
          description: Unauthorized
        "404":
          description: No debit notes found
          content:
            application/json:
              schema:
                type: string
                example: We could not retrieve your Debit notes, we found nothing.
    post:
      summary: Create a new debit note
      tags:
        - Debit Notes
      description: Creates a new debit note against a vendor. Reference is
        auto-generated if not provided. Status "Approved" is mapped to "Unused".
        Non-draft debit notes trigger accounting transactions.
      security:
        - ApiKeyAuth: []
      parameters: []
      responses:
        "201":
          description: Debit note created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  note:
                    $ref: "#/components/schemas/NoteResponse"
        "422":
          description: Validation failed. Pre-validation errors come back as a plain array
            of messages. Model-level errors come back as a field-keyed object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    oneOf:
                      - type: array
                        description: Pre-validation error messages (contact missing, line items
                          missing/invalid, etc.)
                        items:
                          type: string
                        example:
                          - contact id is missing
                          - 'invalid line_items json body - expecting {
                            "debit_note" : { ... line_items: [ {...}, ... ] }}'
                      - type: object
                        description: Model validation errors (field → messages)
                        additionalProperties:
                          type: array
                          items:
                            type: string
                        example:
                          reference:
                            - has already been taken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - debit_note
              properties:
                debit_note:
                  $ref: "#/components/schemas/NoteInput"
