      responses:
        "200":
          description: Invoice payment found
          content:
            application/json:
              schema:
                type: object
                properties:
                  receipt:
                    $ref: "#/components/schemas/ReceiptResponse"
        "404":
          description: Invoice payment not found
  /2.0/customers:
    get:
      summary: List all customers
      tags:
        - Customers
      description: Returns a paginated list of all customer contacts. Supports Ransack
        query parameters via q[] for filtering. Uses will_paginate for
        pagination. When OAuth token has "customer:read" scope, returns
        BasicContactSerializer fields only (id, name, organization, status,
        created_at, updated_at).
      security:
        - ApiKeyAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Page number for pagination (default 1)
          schema:
            type: integer
        - name: per_page
          in: query
          required: false
          description: Number of items per page (default 100)
          schema:
            type: integer
        - name: q[contact_name_cont]
          in: query
          required: false
          description: Filter by customer name (contains)
          schema:
            type: string
        - name: q[primary_email_cont]
          in: query
          required: false
          description: Filter by customer email (contains)
          schema:
            type: string
        - name: q[s]
          in: query
          required: false
          description: Sort order (e.g. "id asc", "contact_name desc")
          schema:
            type: string
      responses:
        "200":
          description: Customers found
          content:
            application/json:
              schema:
                type: object
                properties:
                  customers:
                    type: array
                    items:
                      $ref: "#/components/schemas/ContactResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized - Invalid API key
        "404":
          description: No customers found
          content:
            application/json:
              schema:
                type: string
                example: We could not retrieve your customers, we found nothing.
    post:
      summary: Create a new customer
      tags:
        - Customers
      description: Creates a new customer contact. Accepts a single contact object or
        an array for batch creation. Single creation returns root key "contact",
        batch returns root key "contacts".
      security:
        - ApiKeyAuth: []
      parameters: []
      responses:
        "200":
          description: Batch customers created (when contact param is an array)
          content:
            application/json:
              schema:
                type: object
                properties:
                  contacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/ContactResponse"
        "201":
          description: Customer created successfully (single)
          content:
            application/json:
              schema:
                type: object
                properties:
                  contact:
                    $ref: "#/components/schemas/ContactResponse"
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contact
              properties:
                contact:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Contact full name (mapped to contact_name)
                      example: John Doe
                    organization:
                      type: string
                      description: Company name (mapped to organization_name)
                      example: Acme Corp
                    email:
                      type: string
                      description: Primary email (mapped to primary_email)
                      example: john@acme.com
                    phone_number:
                      type: string
                      description: Primary phone (mapped to primary_contact_number)
                      example: "+966501234567"
                    secondary_phone_number:
                      type: string
                      description: Secondary phone (mapped to secondary_contact_number)
                      example: "+966507654321"
                    tax_number:
                      type: string
                      description: 15-digit tax number starting and ending with 3
                      example: "312345678912343"
                    status:
                      type: string
                      enum:
                        - Active
                        - Inactive
                      example: Active
                    website:
                      type: string
                      example: https://acme.com
                    pos:
                      type: boolean
                      description: Point of sale customer
                      example: false
                    government_entity:
                      type: boolean
                      example: false
                    is_taxed_organization:
                      type: boolean
                      description: Marks the contact as a tax-registered organization
                      example: false
                    secondary_email:
                      type: string
                      description: Secondary email address
                      example: billing@acme.com
                    commission_id:
                      type: integer
                      description: Sales commission scheme to attach to this contact. Must reference
                        an existing commission.
                      example: 7
                    linked_contact_id:
                      type: integer
                      description: >
                        Links this contact to another contact record, for a
                        party that

                        exists as both a customer and a vendor. Only applied
                        when

                        link_to_contact is sent as well; otherwise it is stored
                        as null.

                        A contact already linked to a different record returns
                        422.
                      example: 2184
                    link_to_contact:
                      type: string
                      description: >
                        Confirms linked_contact_id, mirroring the "link to
                        contact"

                        checkbox on the web form. Send any non-blank value to
                        keep

                        linked_contact_id; omit it and linked_contact_id is
                        stored as

                        null. Never persisted itself.
                      example: "1"
                    currency_code:
                      type: string
                      description: >
                        Default currency for this contact, as a currency code
                        present in

                        the tenant's currency list. Only accepted while the

                        ff_multi_currencies feature flag is on for the tenant;
                        with the

                        flag off the field is dropped silently and no currency
                        is set.
                      example: EUR
                    billing_address:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Billing address ID (include to update existing)
                          example: 41
                        contact_id:
                          type: integer
                          description: Contact ID
                          example: 2183
                        billing_address:
                          type: string
                          description: Street address
                          example: 123 Main St
                        billing_city:
                          type: string
                          example: Riyadh
                        billing_state:
                          type: string
                          example: Riyadh Province
                        billing_zip:
                          type: string
                          description: Must be exactly 5 digits when billing_country is Saudi Arabia and
                            ZATCA is active
                          example: "12345"
                        billing_country:
                          type: string
                          description: Country name or ISO alpha-2 code
                          example: Saudi Arabia
                        building_number:
                          type: string
                          description: Must be exactly 4 digits when billing_country is Saudi Arabia
                          example: "1234"
                    shipping_address:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Shipping address ID (include to update existing)
                          example: 35
                        contact_id:
                          type: integer
                          description: Contact ID
                          example: 2183
                        shipping_address:
                          type: string
                          description: Street address
                          example: 456 Delivery St
                        shipping_city:
                          type: string
                          example: Jeddah
                        shipping_state:
                          type: string
                          example: Makkah Province
                        shipping_zip:
                          type: string
                          example: "54321"
                        shipping_country:
                          type: string
                          example: Saudi Arabia
                    customer_details:
                      type: object
                      description: >
                        Additional customer identification details. Keys are
                        numeric

                        indices ("0", "1", etc.), each with a name/value pair.

                        Valid names: cr_number, national_id, iqama_number,
                        gcc_id,

                        tax_group_number, sagia_license, mlsd_license,
                        momra_license,

                        700_number, tin
                      additionalProperties:
                        type: object
                        required:
                          - name
                          - value
                        properties:
                          name:
                            type: string
                            enum:
                              - cr_number
                              - national_id
                              - iqama_number
                              - gcc_id
                              - tax_group_number
                              - sagia_license
                              - mlsd_license
                              - momra_license
                              - 700_number
                              - tin
                          value:
                            type: string
                      example:
                        "0":
                          name: cr_number
                          value: "1234567890"
                        "1":
                          name: national_id
                          value: "1234567890"
                    bank_attributes:
                      type: object
                      description: Bank account details
                      properties:
                        id:
                          type: integer
                          description: Bank ID (include to update existing)
                          example: 1
                        contact_id:
                          type: integer
                          description: Contact ID
                          example: 2183
                        country:
                          type: string
                          example: Saudi Arabia
                        currency:
                          type: string
                          example: SAR
                        name:
                          type: string
                          description: Bank name
                          example: Al Rajhi Bank
                        account_name:
                          type: string
                          example: John Doe
                        account_number:
                          type: string
                          example: "1234567890"
                        iban:
                          type: string
                          example: SA1234567890123456789012
                        swift_code:
                          type: string
                          example: RJHISARI
                        address:
                          type: string
                          example: Riyadh Branch
