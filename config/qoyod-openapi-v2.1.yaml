  /2.0/inventory_adjustments:
    post:
      summary: Create a new inventory adjustment
      tags:
        - Inventory Adjustments
      description: |
        Creates a stock adjustment (StockTake). Status defaults to "Completed".
        Each line item requires product_id and actual_quantity. The server
        calculates the difference from current stock. Returns 200 on success
        and 422 with an "errors" key on validation failure.
      security:
        - ApiKeyAuth: []
      parameters: []
      responses:
        "200":
          description: Inventory adjustment created
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: Success
                    properties:
                      inventory_adjustment:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 123
                          date:
                            type: string
                            format: date
                            description: Mapped from start_date
                            example: 2023-12-01
                          description:
                            type: string
                            example: Monthly stock count
                          created_at:
                            type: string
                            format: date-time
                          updated_at:
                            type: string
                            format: date-time
                          line_items:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  example: 1
                                product:
                                  type: object
                                  properties:
                                    id:
                                      type: integer
                                      example: 2
                                    name:
                                      type: string
                                      example: Office Chair
                                quantity:
                                  type: number
                                  example: 50
                                value:
                                  type: number
                                  example: 25
                          revenue_account:
                            $ref: "#/components/schemas/AccountResponse"
                          expense_account:
                            $ref: "#/components/schemas/AccountResponse"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInvalidResource"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - inventory_adjustment
              properties:
                inventory_adjustment:
                  type: object
                  required:
                    - inventory_id
                    - revenue_account_id
                    - expense_account_id
                    - line_items
                  properties:
                    inventory_id:
                      type: integer
                      example: 1
                    date:
                      type: string
                      format: date
                      description: Sets start_date internally
                      example: 2023-12-01
                    description:
                      type: string
                      example: Monthly stock count
                    status:
                      type: string
                      default: Completed
                      example: Completed
                    revenue_account_id:
                      type: integer
                      description: Account for positive adjustments
                      example: 1
                    expense_account_id:
                      type: integer
                      description: Account for negative adjustments
                      example: 2
                    custom_fields:
                      type: object
                      description: Key-value pairs of custom field names to values
                      additionalProperties:
                        type: string
                    line_items:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        required:
                          - product_id
                          - actual_quantity
                        properties:
                          product_id:
                            type: integer
                            example: 2
                          actual_quantity:
                            type: string
                            description: Actual stock quantity found. Also sets quantity and actual_qty.
                            example: "50.0"
                          current_qty:
                            type: string
                            example: "45.0"
                          rate:
                            type: string
                            description: Item cost per unit (also sets value)
                            example: "25.00"
                          project_id:
                            type: integer
                            description: Optional project to attribute the line to
                            example: 3
  /2.0/inventory_transfers:
    post:
      summary: Create a new inventory transfer
      tags:
        - Inventory Transfers
      description: |
        Creates a stock transfer between two inventory locations. The transfer
        is automatically started and completed (status set to "Received" and
        adjustments processed). Returns 200 on success and 422 with an "errors"
        key on validation failure. This is a CREATE-only endpoint — no index,
        show, update, or delete.
      security:
        - ApiKeyAuth: []
      parameters: []
      responses:
        "200":
          description: Inventory transfer created
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: Success
                    properties:
                      inventory_transfer:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 123
                          date:
                            type: string
                            format: date
                            description: Mapped from start_date
                            example: 2023-12-01
                          description:
                            type: string
                            example: Transfer to branch warehouse
                          from:
                            type: object
                            description: Source location
                            properties:
                              id:
                                type: integer
                                example: 1
                              en_name:
                                type: string
                                example: Main Warehouse
                              ar_name:
                                type: string
                                example: المستودع الرئيسي
                          to:
                            type: object
                            description: Destination location
                            properties:
                              id:
                                type: integer
                                example: 2
                              en_name:
                                type: string
                                example: Branch Warehouse
                              ar_name:
                                type: string
                                example: مستودع الفرع
                          created_at:
                            type: string
                            format: date-time
                          updated_at:
                            type: string
                            format: date-time
                          line_items:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  example: 1
                                product:
                                  type: object
                                  properties:
                                    id:
                                      type: integer
                                      example: 2
                                    name:
                                      type: string
                                      example: Office Chair
                                quantity:
                                  type: number
                                  example: 10
                                value:
                                  type: number
                                  example: 25
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorInvalidResource"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - inventory_transfer
              properties:
                inventory_transfer:
                  type: object
                  required:
                    - from_location
                    - to_location
                    - transfer_account
                    - line_items
                  properties:
                    from_location:
                      type: integer
                      description: Source inventory ID (sets inventory_id)
                      example: 1
                    to_location:
                      type: integer
                      description: Destination inventory ID (sets destination_inventory_id)
                      example: 2
                    transfer_account:
                      type: integer
                      description: Account the transfer posts against. Required — omitting it returns
                        422.
                      example: 15
                    date:
                      type: string
                      format: date
                      description: Transfer date (sets start_date)
                      example: 2023-12-01
                    description:
                      type: string
                      example: Transfer to branch warehouse
                    custom_fields:
                      type: object
                      description: Key-value pairs of custom field names to values
                      additionalProperties:
                        type: string
                    activity_attributes:
                      type: object
                      description: Links the transfer to an activity (e.g. a Project); the
                        project-required guard keys off it
                      properties:
                        activity_id:
                          type: integer
                          example: 3
                        activity_type:
                          type: string
                          example: Project
                    line_items:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        required:
                          - product_id
                          - quantity
                        properties:
                          product_id:
                            type: integer
                            example: 2
                          quantity:
                            type: number
                            example: 10
                          project_id:
                            type: integer
                            description: Optional project to attribute the line to
                            example: 3
