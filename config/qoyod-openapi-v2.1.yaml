          description: Vendor contact ID (must be active)
          example: 1
        reference:
          type: string
          description: Bill reference number (auto-generated if not provided)
          example: BILL-0501
        description:
          type: string
          example: Monthly supplies purchase
        issue_date:
          type: string
          format: date
          example: 2023-12-01
        due_date:
          type: string
          format: date
          example: 2023-12-30
        status:
          type: string
          enum:
            - Draft
            - Approved
          default: Draft
          example: Draft
        inventory_id:
          type: integer
          description: Inventory/location ID (applied to all line items)
          example: 1
        notes:
          type: string
          example: Regular supplier payment
        terms_and_conditions:
          type: string
          description: Also accepts terms_conditions or term_conditions
          example: Net 30 payment terms
        is_third_party:
          type: boolean
          example: false
        is_nominal:
          type: boolean
          example: false
        is_export:
          type: boolean
          example: false
        is_summary:
          type: boolean
          example: false
        self_billed:
          type: boolean
          example: false
        inclusive_cd_discount:
          type: number
          description: >
            Total CD (document-level) discount amount. When greater than 0, the
            org-level "Total CD Discount" setting must be enabled (otherwise 422
            "Total CD Discount is not enabled for this organisation."). Use with
            discount_account_id and discount_tax_id for the VAT-category flow.
          example: 10
        discount_account_id:
          type: integer
          description: >
            GL account the discount is posted to. Required when a discount is
            applied; must reference an existing account (otherwise 422).
          example: 17
        discount_tax_id:
          type: integer
          description: >
            Tax (VAT category) the discount is applied against; must reference
            an existing tax (otherwise 422). The taxable base for this tax must
            be greater than or equal to the discount amount.
          example: 2
        discount_type:
          type: string
          description: |
            Optional. Only "amount" is supported; any other value returns 422.
          enum:
            - amount
          example: amount
        discount_timing:
          type: string
          description: >
            Optional. Only "before_vat" is supported; any other value returns
            422.
          enum:
            - before_vat
          example: before_vat
        line_items:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - product_id
              - inventory_id
              - quantity
              - unit_price
            properties:
              product_id:
                type: integer
                example: 2
              quantity:
                type: string
                example: "5.0"
              unit_price:
                type: string
                example: "170.00"
              description:
                type: string
                example: Office supplies bundle
              discount_percent:
                type: string
                description: Also accepts discount or discount_percentage
                example: "5"
              discount_type:
                type: string
                description: 0 or percent = percentage, 1 or amount = fixed amount
                enum:
                  - "0"
                  - "1"
                  - percent
                  - amount
                example: "0"
              tax_percentage:
                type: string
                description: Also accepts tax_percent. Always provide explicitly to avoid nil
                  errors.
                example: "15"
              tax_id:
                type: integer
                description: Tax ID (auto-resolved from tax_percentage if not provided)
                example: 1
              unit_id:
                type: integer
                description: Unit type ID
                example: 1
              inventory_id:
                type: integer
                example: 1
              is_inclusive:
                type: boolean
                description: Whether unit_price is tax-inclusive
                example: false
              inclusive_unit_price:
                type: string
                description: Tax-inclusive unit price (only used when is_inclusive is true)
                example: "195.50"
              project_id:
                type: integer
                example: 1
    PaginationMeta:
      type: object
      description: Always present on paginated collections. `total` is the row count
        for the whole result set, not the page — compare it with `count` to tell
        whether more rows exist.
      properties:
        count:
          type: integer
          description: Rows in this page
          example: 4
        total:
          type: integer
          description: Rows matching the query across all pages
          example: 4
        perPage:
          type: integer
          example: 100
        currentPage:
          type: integer
          example: 1
        totalPages:
          type: integer
          example: 1
    TaxResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name_en:
          type: string
          example: 15% VAT
        name_ar:
          type: string
          example: ضريبة القيمة المضافة
        percentage:
          type: number
          format: float
          example: 15
        code:
          type: string
          description: ZATCA tax category. Meaning differs by country — see the endpoint
            description. Do not interpret the letter; use percentage and name.
          enum:
            - S
            - Z
            - E
            - O
          example: S
    SpecialTaxReasonResponse:
      type: object
      properties:
        id:
          type: integer
          example: 7
        code:
          type: string
          description: ZATCA exemption code
          example: VATEX-SA-32
        reason:
          type: string
          description: Translation key for seeded rows; free text for not-subject (O)
            rows. Prefer display_reason for anything shown to a user.
          example: export_of_goods
        category:
          type: string
          description: The TAX CODE this reason is valid for — not a product category.
            Must equal the chosen tax's `code` or product creation is rejected.
          enum:
            - Z
            - E
            - O
          example: Z
        display_reason:
          type: string
          description: Human-readable reason in the request locale
          example: Export of goods
    CategoryResponse:
      type: object
      properties:
        id:
          type: integer
          example: 123
        name:
          type: string
          example: Office Supplies
        description:
          type: string
          example: Various office supplies
        parent_id:
          type: integer
          nullable: true
          example: 100
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CategoryInput:
      type: object
      properties:
        name:
          type: string
          example: Office Supplies
        description:
          type: string
          example: Various office supplies
        parent_id:
          type: integer
          description: Parent category ID (sets level=1 automatically if valid)
          example: 100
    ProductResponse:
      type: object
      properties:
        id:
          type: integer
          example: 123
        name_ar:
          type: string
          description: Arabic name (mapped from name)
          example: لوازم مكتبية
        name_en:
          type: string
          description: English name (mapped from en_name)
          example: Office Supplies
        description:
          type: string
          example: Ergonomic office supplies for daily use
        category_id:
          type: integer
          example: 1
        type:
          type: string
          enum:
            - Product
            - Service
            - Expense
            - RawMaterial
            - Recipe
          example: Product
        unit_type:
          type: integer
          description: Product unit type ID (mapped from product_unit_type.id)
          example: 1
        unit:
          type: string
          nullable: true
          description: Unit representation string
          example: Piece
        buying_price:
          type: number
          example: 50
        selling_price:
          type: number
          example: 75
        is_buying_price_inclusive:
          type: boolean
          example: false
        is_selling_price_inclusive:
          type: boolean
          example: false
        sku:
          type: string
          example: OFF-001
        barcode:
          type: string
          example: "1234567890123"
        is_sold:
          type: boolean
          description: True when selling_price is present
          example: true
        is_bought:
          type: boolean
          description: True when buying_price is present
          example: true
        track_quantity:
          type: integer
          description: 0 = untracked, 1 = tracked (stock managed)
          example: 1
        tax_id:
          type: integer
          example: 1
        inventories:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              name_en:
                type: string
                example: Main Warehouse
              name_ar:
                type: string
                example: المستودع الرئيسي
              stock:
                type: number
                example: 25
        ingredients:
          type: array
          description: Empty array for non-Recipe types. Only populated when type =
            "Recipe".
          example: []
          items:
            type: object
            properties:
              product_id:
                type: integer
              quantity:
                type: number
              product_unit_id:
                type: integer
        unit_conversions:
          type: array
          items:
            type: object
            properties:
              product_id:
                type: integer
                example: 123
              to_unit:
                type: integer
                example: 1
              from_unit:
                type: integer
                example: 2
              rate:
                type: number
                example: 12
              barcode:
                type: string
                example: "9876543210987"
              unit_purchase_price:
                type: number
                example: 600
              unit_selling_price:
                type: number
                example: 900
        pos_product:
          type: boolean
          example: true
        special_tax_reason_id:
          type: integer
          nullable: true
          example: 1
        terms_and_conditions:
          type: string
          nullable: true
          example: 30-day return policy
        sales_account_id:
          type: integer
          nullable: true
          example: 17
        expense_account_id:
          type: integer
          nullable: true
          description: Mapped from cogs_account_id
          example: 12
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProductInput:
      type: object
      description: >
        Optional nested attributes not shown here (omit unless needed):

        - `ingredients` (array): ONLY for type="Recipe". Requires "Products >
        advanced" permission.
          Each item: { product_id, quantity, product_unit_id }
        - `unit_conversions` (array): Requires "Unit Conversions > read"
        permission.
          Each item: { from_unit, rate, barcode, unit_purchase_price, unit_selling_price }
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 250
          description: Arabic name (also accepts name_ar). Maximum 250 characters. The
            3-character minimum (ZATCA BT-153) is enforced only for tenants with
            ZATCA Phase 2 active.
          example: لوازم مكتبية
        en_name:
          type: string
          minLength: 3
          maxLength: 250
          description: English name (also accepts name_en). Maximum 250 characters. The
            3-character minimum (ZATCA BT-153) is enforced only for tenants with
            ZATCA Phase 2 active.
          example: Office Supplies
        description:
          type: string
          example: Ergonomic office supplies for daily use
        category_id:
          type: integer
          example: 1
        product_unit_type_id:
          type: integer
          example: 1
        type:
          type: string
          description: Product type (ignored on update). Defaults to "Product" if omitted.
          enum:
            - Product
            - Service
            - Expense
            - RawMaterial
            - Recipe
          example: Product
        sku:
          type: string
          example: OFF-001
        barcode:
          type: string
          example: "1234567890123"
        buying_price:
          type: number
          example: 50
        selling_price:
          type: number
          example: 75
        is_buying_price_inclusive:
          type: boolean
          example: false
        is_selling_price_inclusive:
          type: boolean
          example: false
        track_quantity:
          type: integer
          description: 0 = untracked (default), 1 = tracked (stock managed)
          example: 1
        tax_id:
          type: integer
          example: 1
        sale_item:
          type: boolean
          example: true
        purchase_item:
          type: boolean
          example: true
        pos_product:
          type: boolean
          description: Auto-set to true if sale_item is true and pos_product is nil
          example: true
        special_tax_reason_id:
          type: integer
          example: 1
        terms_and_conditions:
          type: string
          example: 30-day return policy
        sales_account_id:
          type: integer
          example: 17
        expense_account_id:
          type: integer
          description: Alias for cogs_account_id
          example: 12
        cogs_account_id:
          type: integer
          example: 12
        purchase_account_id:
          type: integer
          example: 12
        product_attribute_set_id:
          type: integer
          description: Attribute set used to generate variants. Variants are created only
            when the PRODUCT_ATTRIBUTES flag is on for the tenant and the
            product tracks quantity.
          example: 4
        product_inventories_attributes:
          type: array
          description: Per-inventory reorder points
          items:
            type: object
            properties:
              inventory_id:
                type: integer
                example: 1
              reorder_point:
                type: number
                example: 7
    AccountInput:
      type: object
      description: >
        Required fields for create: en_name, ar_name, account_kind, parent_kind,
        branch_kind.

        Auto-calculated by the server: parent_id (from branch_kind, on create
        only), type_of_account (Debit for assets/expense, Credit for others),
        status (always Active on create; not settable on update).

        Do NOT send parent_id, account_nature, or deferral_template_id unless
        you know the exact valid values — invalid IDs will cause a 500 error.
      properties:
        en_name:
          type: string
          description: Account name in English (required)
          example: Petty Cash
        ar_name:
          type: string
          description: Account name in Arabic (required)
          example: النقدية الصغيرة
        code:
          type: string
          description: Account code (optional, auto-generated if not provided)
          example: "1002"
        description:
          type: string
          example: Small cash amounts for minor expenses
        account_kind:
          type: string
          description: Specific account kind (required)
          example: petty_cash
          enum:
            - accounts_receivable
            - bank_account
            - employees_advances
            - inventory
            - non_bank_cash_and_equivalents
            - other_current_assets
            - petty_cash
            - prepaid_expenses_and_others
            - intangible_assets
            - other_fixed_assets
            - property_plant_and_equipment
            - additional_paid_in_capital
            - employees_equity
            - registered_capital
            - other_equity
            - reserves
            - retained_earnings
            - cost_of_sales
            - other_direct_cost
            - taxes
            - amortization
            - depreciation
            - accumulated_amortization
            - employee_incentives_and_benefits
            - general_and_administrative
            - marketing
            - other_operational_cost
            - salaries
            - technical_and_consulting_expenses
            - accounts_payable
            - accrued_expenses
            - accrued_salaries_and_amounts_owed_to_employees
            - accumulated_depreciation
            - allowance_for_doubtful_accounts
            - end_of_service_benefits
            - other_current_liability
            - provisions
            - short_term_borrowings
            - taxes_payable
            - unearned_revenues
            - long_term_borrowings
            - other_non_current_liabilities
            - other_revenue
            - sales
            - vat
        parent_kind:
          type: string
          description: Parent account category (required)
          example: assets
          enum:
            - assets
            - liability
            - expense
            - equity
            - revenue
        branch_kind:
          type: string
          description: Branch account category (required)
          example: current_assets
          enum:
            - current_assets
            - fixed_assets
            - issued_capital
            - other_equity
            - retained_earnings
            - direct_cost
            - non_operational_expense
            - operational_cost
            - current_liability
            - non_current_liability
            - non_operative_revenue
            - sales
        receive_payments:
          type: boolean
          description: Whether this account can receive payments
          example: false
