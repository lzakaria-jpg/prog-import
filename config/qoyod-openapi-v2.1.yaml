  /2.0/invoice_payments:
    get:
      summary: List all invoice payments
      tags:
        - Invoice Payments
      description: Returns all received receipts (kind=received). Uses Receipt model
        with .received_payments scope. Supports Ransack query parameters via
        q[]. Root key is "receipts".
      security:
        - ApiKeyAuth: []
      parameters:
        - name: q[contact_id_eq]
          in: query
          required: false
          description: Filter by customer contact ID
          schema:
            type: integer
        - name: q[s]
          in: query
          required: false
          description: Sort order (default "id asc")
          schema:
            type: string
      responses:
        "200":
          description: Invoice payments found
          content:
            application/json:
              schema:
                type: object
                properties:
                  receipts:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReceiptResponse"
        "401":
          description: Unauthorized
    post:
      summary: Create a new invoice payment
      tags:
        - Invoice Payments
      description: |
        Records a payment against an invoice. Requires invoice_id pointing to a
        non-Draft invoice. The server automatically sets contact_id from the
        invoice, kind="received", is_receipt=true, and creates the allocation.
        Invoice must NOT be in Draft or "Awaiting for approval" status.
      security:
        - ApiKeyAuth: []
      parameters: []
      responses:
        "200":
          description: Invoice payment created successfully (uses receipts/show template)
          content:
            application/json:
              schema:
                type: object
                properties:
                  receipt:
                    $ref: "#/components/schemas/ReceiptResponse"
        "422":
          description: Validation failed or invoice is in Draft status
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      errors:
                        type: string
                        example: Cannot pay Draft invoice
                  - $ref: "#/components/schemas/ReceiptInvalidResource"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - invoice_payment
              properties:
                invoice_payment:
                  type: object
                  required:
                    - invoice_id
                    - amount
                    - account_id
                    - date
                  properties:
                    invoice_id:
                      type: integer
                      description: Invoice being paid (must be non-Draft)
                      example: 8
                    amount:
                      type: string
                      example: "200.00"
                    account_id:
                      type: integer
                      description: Bank/cash account being credited
                      example: 1
                    date:
                      type: string
                      format: date
                      example: 2023-12-15
                    reference:
                      type: string
                      example: IP-0501
                    description:
                      type: string
                      example: Payment for invoice INV-001
