      description: >
        Required fields: contact_id, issue_date, inventory_id,
        simple_bill_items_attributes.

        Each line item requires: expense_category_id, total_amount, tax_id.

        - inventory_id is document-level and is applied to every line item; a
        value sent
          inside a line item is ignored and overwritten by the document-level one.
        - reference is auto-generated if not provided.

        - status defaults to "Draft".
      properties:
        contact_id:
          type: integer
          description: Vendor contact ID (must be active vendor)
          example: 1
        reference:
          type: string
          description: Auto-generated if not provided
          example: SB-0501
